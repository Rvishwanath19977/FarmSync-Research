<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="FarmSync research demonstrator for fairness-aware farmer-in-the-loop collective crop planning under uncertainty."
    >

    <title>{% block title %}FarmSync Research{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}"
    >

    {% block head %}{% endblock %}

    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme");
            const prefersDark =
                window.matchMedia("(prefers-color-scheme: dark)").matches;

            document.documentElement.setAttribute(
                "data-theme",
                savedTheme || (prefersDark ? "dark" : "light")
            );
        })();
    </script>
</head>

<body>
    <header class="research-header">
        <div class="research-header-inner">
            <a href="/farm-sync" class="research-brand">
                <span class="research-brand-mark" aria-hidden="true"></span>
                <span>FarmSync</span>
            </a>

            <div class="research-header-meta">
                <span class="research-label">Research Demonstrator</span>

                <button
                    class="theme-toggle"
                    id="themeToggle"
                    type="button"
                    aria-label="Toggle light and dark theme"
                >
                    <span class="theme-toggle-track"></span>
                    <span class="theme-toggle-thumb">
                        <svg
                            class="theme-toggle-icon moon"
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            aria-hidden="true"
                        >
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>

                        <svg
                            class="theme-toggle-icon sun"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            aria-hidden="true"
                        >
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
    </header>

    <div class="research-main">
        {% block content %}{% endblock %}
    </div>

    <footer class="research-footer">
        <div class="section-container">
            <p>
                FarmSync-Research ? reproducible research software and
                publication artefacts.
            </p>
        </div>
    </footer>

    <script
        src="{{ url_for('static', filename='js/theme.js') }}"
    ></script>

    {% block scripts %}{% endblock %}
</body>
</html>
